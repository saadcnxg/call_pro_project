; =============================================================
; CallFlow Pro - Master Dialplan
; =============================================================

[globals]
RECORDING_PATH=/var/spool/asterisk/monitor
COMPANY_NAME=CallFlow Pro Inc
MAX_QUEUE_WAIT=180
DB_RESULT=

;--------------------------------------------------------------
; GENERAL / SUBSCRIBER CONTEXT (all agents land here by default)
;--------------------------------------------------------------
[general-features]
; *22 = agent login, *23 = agent logout, *45 = call parking
exten => *22,1,Answer()
 same => n,AgentLogin(${CHANNEL(peername)})
 same => n,Hangup()

exten => *23,1,Answer()
 same => n,Set(AGENT_STATUS=LOGGED_OUT)
 same => n,AgentLogoff()
 same => n,Hangup()

exten => *45,1,Answer()
 same => n,Park()

include => agents-internal

;--------------------------------------------------------------
; AGENTS INTERNAL CONTEXT
;--------------------------------------------------------------
[agents-internal]
; internal extension-to-extension dialing (6001-6200 range)
exten => _6XXX,1,NoOp(Internal call to Agent ${EXTEN})
 same => n,Set(CDR(userfield)=INTERNAL)
 same => n,Dial(SIP/${EXTEN},20,tT)
 same => n,Voicemail(${EXTEN}@agents,u)
 same => n,Hangup()

include => general-features
include => queues-context

;--------------------------------------------------------------
; MAIN INBOUND ROUTE - PRIMARY TRUNK
;--------------------------------------------------------------
[from-trunk-primary]
exten => _X.,1,NoOp(Inbound call from Primary Trunk - DID: ${EXTEN})
 same => n,Answer()
 same => n,Set(CHANNEL(language)=en)
 same => n,Set(CALLERID(name)=${CALLERID(name)})
 same => n,MixMonitor(${RECORDING_PATH}/${UNIQUEID}.wav)
 same => n,Goto(time-conditions,check,1)

[from-trunk-backup]
exten => _X.,1,NoOp(Inbound call from Backup Trunk (FAILOVER ACTIVE) - DID: ${EXTEN})
 same => n,Answer()
 same => n,Set(CDR(userfield)=FAILOVER_TRUNK)
 same => n,Goto(time-conditions,check,1)

;--------------------------------------------------------------
; TIME CONDITIONS - BUSINESS HOURS ROUTING
;--------------------------------------------------------------
[time-conditions]
exten => check,1,NoOp(Checking business hours)
 same => n,GotoIfTime(09:00-18:00,mon-fri,*,*?open,1)
 same => n,GotoIfTime(10:00-14:00,sat,*,*?open,1)
 same => n,Goto(closed,1)

exten => open,1,NoOp(Business is open - route to main IVR)
 same => n,Goto(ivr-main,s,1)

exten => closed,1,NoOp(Business is closed - after hours)
 same => n,Playback(after-hours-message)
 same => n,Voicemail(general@departments,u)
 same => n,Hangup()

;--------------------------------------------------------------
; MAIN IVR MENU
;--------------------------------------------------------------
[ivr-main]
exten => s,1,NoOp(Main IVR entry)
 same => n,Background(welcome-to-callflow-pro)
 same => n,WaitExten(5)

exten => 1,1,Goto(routing-language,english,1)
exten => 2,1,Goto(routing-language,urdu,1)
exten => 9,1,Goto(from-trunk-primary,operator,1)
exten => i,1,Playback(invalid-option)
 same => n,Goto(ivr-main,s,1)
exten => t,1,Goto(closed,1)

;--------------------------------------------------------------
; LANGUAGE ROUTING
;--------------------------------------------------------------
[routing-language]
exten => english,1,Set(CHANNEL(language)=en)
 same => n,Goto(routing-department,menu,1)

exten => urdu,1,Set(CHANNEL(language)=ur)
 same => n,Goto(routing-department,menu,1)

;--------------------------------------------------------------
; DEPARTMENT / SKILL-BASED ROUTING
;--------------------------------------------------------------
[routing-department]
exten => menu,1,Background(press-1-sales-2-support-3-billing)
 same => n,WaitExten(5)

exten => 1,1,Set(QUEUE_PRIORITY=STANDARD)
 same => n,Goto(queues-context,sales,1)

exten => 2,1,Set(QUEUE_PRIORITY=STANDARD)
 same => n,Goto(queues-context,support,1)

exten => 3,1,Set(QUEUE_PRIORITY=HIGH)
 same => n,Goto(queues-context,billing,1)

exten => i,1,Goto(routing-department,menu,1)
exten => t,1,Goto(queues-context,support,1)

;--------------------------------------------------------------
; CALLER-ID BASED VIP ROUTING (returning / VIP customers)
;--------------------------------------------------------------
[vip-check]
exten => s,1,NoOp(Checking if caller is VIP)
 same => n,MYSQL(Connect connid localhost callflow_user callflow_pass callflow_db)
 same => n,MYSQL(Query resultid ${connid} SELECT tier FROM customers WHERE phone='${CALLERID(num)}' LIMIT 1)
 same => n,MYSQL(Fetch fetchid ${resultid} DB_RESULT)
 same => n,MYSQL(Clear ${resultid})
 same => n,MYSQL(Disconnect ${connid})
 same => n,GotoIf($["${DB_RESULT}" = "VIP"]?vip-queue,1:standard-queue,1)

;--------------------------------------------------------------
; QUEUE CONTEXT (see queues.conf for queue definitions)
;--------------------------------------------------------------
[queues-context]
exten => sales,1,NoOp(Routing to Sales Queue)
 same => n,Set(QUEUE_VAR=sales_queue)
 same => n,Goto(queue-dispatch,s,1)

exten => support,1,NoOp(Routing to Support Queue)
 same => n,Set(QUEUE_VAR=support_queue)
 same => n,Goto(queue-dispatch,s,1)

exten => billing,1,NoOp(Routing to Billing Queue - high priority)
 same => n,Set(QUEUE_VAR=billing_queue)
 same => n,Goto(queue-dispatch,s,1)

exten => operator,1,Dial(SIP/6001,20,tT)
 same => n,Voicemail(6001@agents,u)
 same => n,Hangup()

[queue-dispatch]
exten => s,1,NoOp(Dispatching to queue: ${QUEUE_VAR})
 same => n,Set(QUEUE_ENTER_TIME=${EPOCH})
 same => n,Queue(${QUEUE_VAR},t,,,${MAX_QUEUE_WAIT},,,,)
 same => n,GotoIf($["${QUEUESTATUS}" = "FULL"]?overflow,1)
 same => n,GotoIf($["${QUEUESTATUS}" = "TIMEOUT"]?overflow,1)
 same => n,Hangup()

exten => overflow,1,NoOp(Queue overflow - trying secondary queue)
 same => n,Queue(overflow_queue,t,,,120)
 same => n,Voicemail(general@departments,u)
 same => n,Hangup()

;--------------------------------------------------------------
; AGENT LOGIN/LOGOUT FEATURE CODES ALREADY HANDLED ABOVE
;--------------------------------------------------------------
