; =============================================================
; CallFlow Pro - Voicemail Configuration
; Multi-department voicemail boxes
; =============================================================

[general]
format=wav49|gsm|wav
serveremail=noreply@callflowpro.com
attach=yes
skipms=3000
maxsilence=10
silencethreshold=128
maxlogins=3
emaildateformat=%A, %B %d, %Y at %r
pagerdateformat=%A, %B %d, %Y at %r
sendvoicemail=yes
review=yes
operator=yes
envelope=yes
delete=no                       ; keep copy on server after emailing

;--------------------------------------------------------------
; AGENT MAILBOXES (auto-generated for 200 agents, sample below)
;--------------------------------------------------------------
[agents]
6001 => 4821,Agent 6001,agent6001@callflowpro.com,,attach=yes|saycid=yes
6002 => 5732,Agent 6002,agent6002@callflowpro.com,,attach=yes|saycid=yes
6003 => 9143,Agent 6003,agent6003@callflowpro.com,,attach=yes|saycid=yes
; ... remaining agents 6004-6200 provisioned by scripts/generate-agents.sh

;--------------------------------------------------------------
; DEPARTMENT-LEVEL SHARED MAILBOXES
;--------------------------------------------------------------
[departments]
general    => 1000,General Inquiries,support@callflowpro.com,,attach=yes
sales      => 2000,Sales Department,sales@callflowpro.com,,attach=yes
support    => 3000,Support Department,support@callflowpro.com,,attach=yes
billing    => 4000,Billing Department,billing@callflowpro.com,,attach=yes
management => 5000,Management,management@callflowpro.com,,attach=yes|delete=no
