; =============================================================
; CallFlow Pro - Feature Codes Configuration
; =============================================================

[general]
featuredigittimeout=1000
transferdigittimeout=3
xfersound=beep
pickupsound=pickup
pickupfailsound=beeperr
courtesytone=beep
transferdialattempts=3

[featuremap]
blindxfer=#1                    ; blind transfer
disconnect=*0                   ; hangup current call
automon=*1                      ; toggle call recording
atxfer=*2                       ; attended transfer
parkcall=*3                     ; park call
automixmon=*4                   ; toggle MixMonitor recording

[applicationmap]
; Custom feature during active call (dial *5 mid-call for callback consult)
Callback => *5,self/callee,Playback,callback-initiated
; Whisper coach mode for supervisors
WhisperTo => *6,peer,ChanSpy,${CHANNEL(peer)},qw

;--------------------------------------------------------------
; CALL PICKUP GROUPS
;--------------------------------------------------------------
[general]
pickupexten=*8

; Sales team pickup group
[pickup-sales]
callgroup=1
pickupgroup=1

; Support team pickup group
[pickup-support]
callgroup=2
pickupgroup=2

; Billing team pickup group
[pickup-billing]
callgroup=3
pickupgroup=3
