; =============================================================
; CallFlow Pro - Queue Configuration
; =============================================================

[general]
persistentmembers=yes
autofill=yes
monitor-type=MixMonitor
shared_lastcall=yes
update_cdr=yes

;--------------------------------------------------------------
; SALES QUEUE
;--------------------------------------------------------------
[sales_queue]
strategy=rrmemory              ; round-robin, memory of last agent
musicclass=default
joinempty=yes
leavewhenempty=no
ringinuse=no
timeout=20                     ; ring time per agent
retry=5
wrapuptime=15                  ; after-call work time
maxlen=50                      ; max callers waiting
servicelevel=20
periodic-announce=queue-hold-message
periodic-announce-frequency=30
announce-position=yes
announce-holdtime=yes
reportholdtime=yes
member => SIP/6001
member => SIP/6002
member => SIP/6003
; ... remaining sales agents injected via agents.conf / provisioning script

;--------------------------------------------------------------
; SUPPORT QUEUE
;--------------------------------------------------------------
[support_queue]
strategy=leastrecent
musicclass=default
joinempty=yes
leavewhenempty=no
ringinuse=no
timeout=25
retry=5
wrapuptime=30
maxlen=75
servicelevel=30
periodic-announce=queue-hold-message
periodic-announce-frequency=45
announce-position=yes
announce-holdtime=yes
member => SIP/6101
member => SIP/6102
member => SIP/6103

;--------------------------------------------------------------
; BILLING QUEUE (higher priority - shorter SLA)
;--------------------------------------------------------------
[billing_queue]
strategy=fewestcalls
musicclass=default
joinempty=yes
leavewhenempty=no
ringinuse=no
timeout=15
retry=3
wrapuptime=20
maxlen=30
servicelevel=15
periodic-announce=queue-hold-message
periodic-announce-frequency=25
announce-position=yes
member => SIP/6201
member => SIP/6202

;--------------------------------------------------------------
; VIP QUEUE (skips normal queue, top priority)
;--------------------------------------------------------------
[vip_queue]
strategy=ringall
musicclass=default
joinempty=yes
leavewhenempty=no
timeout=10
retry=2
wrapuptime=10
maxlen=10
servicelevel=10
member => SIP/6001
member => SIP/6101

;--------------------------------------------------------------
; OVERFLOW QUEUE (catch-all when primary queues are full/timeout)
;--------------------------------------------------------------
[overflow_queue]
strategy=rrmemory
musicclass=default
joinempty=yes
leavewhenempty=no
timeout=20
retry=5
wrapuptime=15
maxlen=100
servicelevel=45
member => SIP/6001
member => SIP/6101
member => SIP/6201
