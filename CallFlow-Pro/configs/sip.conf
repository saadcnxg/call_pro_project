; =============================================================
; CallFlow Pro - SIP Configuration (chan_sip)
; Multi-tenant, multi-trunk SIP configuration for 200-agent PBX
; NOTE: chan_sip is deprecated upstream (removed in Asterisk 21+).
; If you're on Asterisk 21+, you'll need chan_sip compiled from the
; asterisk-legacy repo/source, since it is no longer bundled by default.
; =============================================================

[general]
context=agents-internal
allowguest=no
allowoverlap=no
udpbindaddr=0.0.0.0:5060
tcpenable=yes
tcpbindaddr=0.0.0.0:5060
transport=udp,tcp
srvlookup=yes
disallow=all
allow=opus
allow=g722
allow=ulaw
dtmfmode=rfc2833
nat=force_rport,comedia
directmedia=no
qualify=yes
qualifyfreq=30
externip=YOUR_PUBLIC_IP
localnet=192.168.0.0/255.255.0.0
localnet=10.0.0.0/255.0.0.0
rtptimeout=300
rtpholdtimeout=600
useragent=CallFlowPro-PBX
sendrpid=yes
trustrpid=yes
callevents=yes
alwaysauthreject=yes            ; security: don't leak valid-username info

; -----------------------------------------------------------
; TLS (optional, recommended for production)
; -----------------------------------------------------------
tlsenable=yes
tlsbindaddr=0.0.0.0:5061
tlscertfile=/etc/asterisk/keys/asterisk.pem
tlsprivatekey=/etc/asterisk/keys/asterisk.key
tlsclientmethod=tlsv1_2

;--------------------------------------------------------------
; GLOBAL AGENT PEER TEMPLATE (inherited by all agents)
;--------------------------------------------------------------
[agent-template](!)
type=friend
context=agents-internal
host=dynamic
disallow=all
allow=opus,g722,ulaw
dtmfmode=rfc2833
nat=force_rport,comedia
directmedia=no
qualify=yes
qualifyfreq=30
call-limit=2
mailbox=SAME
canreinvite=no

;--------------------------------------------------------------
; EXAMPLE AGENT (real 200 agents generated via
; scripts/generate-agents.sh into agents-sip.conf and #included below)
;--------------------------------------------------------------
[6001](agent-template)
secret=CHANGE_ME_STRONG_PASSWORD
callerid="Agent 6001 <6001>"

; Include the auto-generated 200 agent peer blocks
#include agents-sip.conf

;--------------------------------------------------------------
; SIP TRUNK 1 - PRIMARY PROVIDER
;--------------------------------------------------------------
[trunk-primary]
type=peer
host=sip.primary-provider.com
fromuser=YOUR_TRUNK1_USERNAME
fromdomain=sip.primary-provider.com
username=YOUR_TRUNK1_USERNAME
secret=YOUR_TRUNK1_PASSWORD
insecure=port,invite
disallow=all
allow=ulaw,alaw,g722
context=from-trunk-primary
qualify=yes
nat=force_rport,comedia
sendrpid=yes

register => YOUR_TRUNK1_USERNAME:YOUR_TRUNK1_PASSWORD@sip.primary-provider.com

;--------------------------------------------------------------
; SIP TRUNK 2 - FAILOVER / BACKUP PROVIDER
;--------------------------------------------------------------
[trunk-backup]
type=peer
host=sip.backup-provider.com
fromuser=YOUR_TRUNK2_USERNAME
fromdomain=sip.backup-provider.com
username=YOUR_TRUNK2_USERNAME
secret=YOUR_TRUNK2_PASSWORD
insecure=port,invite
disallow=all
allow=ulaw,alaw,g722
context=from-trunk-backup
qualify=yes
nat=force_rport,comedia
sendrpid=yes

register => YOUR_TRUNK2_USERNAME:YOUR_TRUNK2_PASSWORD@sip.backup-provider.com

;--------------------------------------------------------------
; MULTI-TENANT SUPPORT (example: 2 departments/tenants)
; Each tenant gets isolated context via a dedicated template
;--------------------------------------------------------------
[tenant-sales-template](agent-template)
context=agents-sales

[tenant-support-template](agent-template)
context=agents-support
